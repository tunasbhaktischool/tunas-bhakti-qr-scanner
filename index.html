<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal Sekolah — Live QR Scanner</title>
<style>body{margin:0;background:#071b3a;color:#fff;font-family:Arial,sans-serif} .wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;color:#10213f;border-radius:24px;padding:18px;box-shadow:0 20px 50px #0006}.stage{position:relative;aspect-ratio:1/1;background:#000;border-radius:20px;overflow:hidden}.stage video{width:100%;height:100%;object-fit:cover}.scan{position:absolute;inset:15%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0005}.scan:after{content:"";position:absolute;left:5%;right:5%;top:50%;height:3px;background:#e21b23;box-shadow:0 0 15px #e21b23;animation:line 1.6s linear infinite}@keyframes line{0%{transform:translateY(-120px)}50%{transform:translateY(120px)}100%{transform:translateY(-120px)}}button{width:100%;padding:14px;border:0;border-radius:14px;background:#1749c6;color:#fff;font-weight:800;margin-top:12px}#status{text-align:center;font-weight:700;margin:12px 0}.hint{font-size:13px;color:#66758e;text-align:center}</style>
</head>
<body><div class="wrap"><div class="card"><h2 style="margin-top:0">SCAN QR ABSENSI</h2><div class="stage"><video id="video" autoplay muted playsinline></video><div class="scan"></div></div><div id="status">MEMBUKA KAMERA…</div><div class="hint">Arahkan kotak putih ke QR guru/admin. Scanner akan fokus dan membaca otomatis.</div><button id="start">AKTIFKAN KAMERA</button></div></div>
<script>
const video=document.getElementById('video'),status=document.getElementById('status'),start=document.getElementById('start');let stream=null,detector=null,running=false;
async function scan(){if(!running)return;try{if(detector){const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){send(codes[0].rawValue);return}}else if(window.jsQR){const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=video.videoWidth;c.height=video.videoHeight;x.drawImage(video,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(r&&r.data){send(r.data);return}}}catch(e){console.warn(e)}requestAnimationFrame(scan)}
function send(token){running=false;status.textContent='QR TERDETEKSI — MENGIRIM…';if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'PORTAL_QR_RESULT',token:String(token)},'*');setTimeout(()=>window.close(),350)}}
async function startCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},focusMode:'continuous'},audio:false});video.srcObject=stream;await video.play();status.textContent='KAMERA AKTIF — SCAN QR…';if('BarcodeDetector'in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))detector=new BarcodeDetector({formats:['qr_code']})}catch(e){}}if(!detector){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=()=>{running=true;requestAnimationFrame(scan)};s.onerror=()=>{status.textContent='LIBRARY QR GAGAL DIMUAT'};document.head.appendChild(s)}else{running=true;requestAnimationFrame(scan)}}catch(e){status.textContent='KAMERA GAGAL: '+(e.name||e.message);}}
start.addEventListener('click',startCam);startCam();window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
